<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Structured Credit Pricer</title>

    <!-- This is the magic line that makes it beautiful! -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Configure Tailwind to listen to our Dark Mode button -->
    <script>
      tailwind.config = { darkMode: 'class' };
    </script>

    <!-- 3. THIRD: Check system/saved preference instantly to prevent white flash -->
    <script>
      if (
        localStorage.theme === 'dark' ||
        (!('theme' in localStorage) &&
          window.matchMedia('(prefers-color-scheme: dark)').matches)
      ) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
